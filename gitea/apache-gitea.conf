# ============================================================
#  Apache Reverse Proxy fuer Gitea  (OPTIONAL)
#  Nur noetig, wenn Gitea von AUSSEN ueber eine Domain + HTTPS
#  erreichbar sein soll. Fuer reinen Localhost-Betrieb NICHT noetig.
#
#  Gitea lauscht lokal auf http://127.0.0.1:9200 (nicht oeffentlich).
#  Apache terminiert TLS auf 443 und leitet intern weiter.
#
#  Voraussetzungen (in httpd.conf aktivieren):
#     LoadModule proxy_module           modules/mod_proxy.so
#     LoadModule proxy_http_module       modules/mod_proxy_http.so
#     LoadModule ssl_module              modules/mod_ssl.so
#     LoadModule headers_module          modules/mod_headers.so
#     LoadModule rewrite_module          modules/mod_rewrite.so
#
#  Danach in Gitea  C:\gitea\custom\conf\app.ini  setzen:
#     [server]  ROOT_URL = https://git.DEINE-DOMAIN.tld/
#     [security] COOKIE_SECURE = true
#     [session]  COOKIE_SECURE = true
#  und:  Restart-Service Gitea
# ============================================================

# --- HTTP -> HTTPS Weiterleitung ---
<VirtualHost *:80>
    ServerName git.DEINE-DOMAIN.tld
    RewriteEngine On
    RewriteRule ^/(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName git.DEINE-DOMAIN.tld

    SSLEngine on
    # Pfade an deine Zertifikate anpassen:
    SSLCertificateFile      "C:/Apache24/conf/ssl/git.DEINE-DOMAIN.tld.crt"
    SSLCertificateKeyFile   "C:/Apache24/conf/ssl/git.DEINE-DOMAIN.tld.key"
    # Bei Bedarf Chain:
    # SSLCertificateChainFile "C:/Apache24/conf/ssl/chain.crt"

    SSLProtocol             -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder     on

    # Sicherheits-Header
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Grosse Git-Pushes erlauben (0 = unbegrenzt)
    LimitRequestBody 0

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass        / http://127.0.0.1:9200/
    ProxyPassReverse / http://127.0.0.1:9200/

    ErrorLog  "logs/gitea_ssl_error.log"
    CustomLog "logs/gitea_ssl_access.log" combined
</VirtualHost>
